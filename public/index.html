<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snitch Razorpay Test</title>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <style>
    body { font-family: Arial, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; }
    label { display: block; margin-top: 16px; font-weight: 600; }
    input, button { box-sizing: border-box; font: inherit; margin-top: 6px; padding: 10px; width: 100%; }
    button { cursor: pointer; }
    #status { white-space: pre-wrap; margin-top: 20px; }
  </style>
</head>
<body>
  <h1>Razorpay Test Payment</h1>
  <p>This page uses the authenticated user's existing cart.</p>

  <label for="token">Access token</label>
  <input id="token" type="password" placeholder="Paste your Bearer token without 'Bearer'">

  <button id="payButton" type="button">Create order and pay</button>
  <div id="status" role="status"></div>

  <script>
    const tokenInput = document.querySelector("#token");
    const payButton = document.querySelector("#payButton");
    const status = document.querySelector("#status");

    function showStatus(message) {
      status.textContent = message;
    }

    async function createOrder() {
      const response = await fetch("/api/payment/order", {
        method: "POST",
        headers: {
          Authorization: "Bearer " + tokenInput.value.trim(),
          "Content-Type": "application/json",
        },
      });
      const data = await response.json();
      if (!response.ok || !data.success) {
        throw new Error(data.message || "Unable to create payment order");
      }
      return data.data;
    }

    payButton.addEventListener("click", async () => {
      if (!tokenInput.value.trim()) {
        showStatus("Enter an access token first.");
        return;
      }

      payButton.disabled = true;
      showStatus("Creating Razorpay order...");

      try {
        const order = await createOrder();
        const checkout = new Razorpay({
          key: order.keyId,
          amount: order.amount,
          currency: order.currency,
          name: "Snitch",
          description: "Cart payment",
          order_id: order.orderId,
          handler: async (checkoutResponse) => {
            showStatus("Payment completed. Verifying payment...");
            const response = await fetch("/api/payment/verify", {
              method: "POST",
              headers: {
                Authorization: "Bearer " + tokenInput.value.trim(),
                "Content-Type": "application/json",
              },
              body: JSON.stringify(checkoutResponse),
            });
            const data = await response.json();
            showStatus(JSON.stringify(data, null, 2));
          },
          modal: {
            ondismiss: () => showStatus("Checkout closed before completion."),
          },
        });

        checkout.on("payment.failed", (event) => {
          showStatus(`Payment failed: ${event.error.description}`);
        });
        checkout.open();
      } catch (error) {
        showStatus(error.message);
      } finally {
        payButton.disabled = false;
      }
    });
  </script>
</body>
</html>
